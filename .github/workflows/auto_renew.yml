name: TickHosting Verification Check

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_tickhosting:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check TickHosting session and page
        env:
          PTERODACTYL_SESSION: ${{ secrets.PTERODACTYL_SESSION }}
          CHECK_WAIT_SECONDS: '35'
        run: python auto_renew.py
