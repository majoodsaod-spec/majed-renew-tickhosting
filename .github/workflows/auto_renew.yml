
name: Auto Renew Tickhosting

on:
  workflow_dispatch:
    inputs:
      login_test_only:
        description: "Test login without renewing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  auto_renew_tickhosting:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run TickHosting script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PTERODACTYL_SESSION: ${{ secrets.PTERODACTYL_SESSION }}
          TEST_LOGIN_ONLY: ${{ inputs.login_test_only }}
        run: python auto_renew.py
